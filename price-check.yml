name: Price check

on:
  schedule:
    - cron: "*/15 23,0-12 * * *"   # 06:00-19:45 WIB
    - cron: "0 13 * * *"           # 20:00 WIB
  workflow_dispatch:
    inputs:
      debug:
        description: "Print parsed flavor/price data in the log"
        type: boolean
        default: false
      send_test:
        description: "Send a test WhatsApp message and stop"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check price
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET: ${{ secrets.WA_TARGET }}
          ALERT_PRICE: ${{ vars.ALERT_PRICE }}
          DEBUG: ${{ inputs.debug }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python check_price.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git pull --rebase
            git push
          fi

      - name: Keep schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable price-check.yml
